# ─────────────────────────────────────────────────────────────
# Kafka Connect Worker Configuration — Production
# ─────────────────────────────────────────────────────────────

# ── Worker identity ──
group.id=debezium-connect-cluster

# ── Kafka connectivity ──
bootstrap.servers=kafka:29092

# ── Internal storage topics ──
config.storage.topic=debezium-connect-configs
config.storage.replication.factor=3

offset.storage.topic=debezium-connect-offsets
offset.storage.replication.factor=3
offset.storage.partitions=25

status.storage.topic=debezium-connect-status
status.storage.replication.factor=3
status.storage.partitions=5

# ── Converters (Avro + Schema Registry — matches producer) ──
key.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=http://schema-registry:8081
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081

# ── Error handling ──
errors.tolerance=all
errors.log.enable=true
errors.log.include.messages=true

errors.retry.timeout=300000
errors.retry.delay.max.ms=10000

# ── Plugin path ──
plugin.path=/usr/share/java,/usr/share/confluent-hub-components

# ── REST API ──
rest.port=8083
rest.advertised.host.name=connect-1
rest.advertised.port=8083

# ── Offset commit tuning ──
offset.flush.interval.ms=10000
offset.flush.timeout.ms=5000

# ── Task graceful shutdown ──
task.shutdown.graceful.timeout.ms=30000

# ── Producer tuning for CDC throughput ──
producer.compression.type=snappy
producer.max.request.size=1048576
producer.linger.ms=50
producer.batch.size=16384

# ── Consumer tuning ──
consumer.max.poll.records=500
consumer.max.poll.interval.ms=300000